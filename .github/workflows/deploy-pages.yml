name: Deploy calculator to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm ci
      - name: Build and verify static export
        run: npm test
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Notify IndexNow
        shell: bash
        run: |
          curl --fail-with-body --retry 3 "https://api.indexnow.org/indexnow" \
            --header "Content-Type: application/json; charset=utf-8" \
            --data '{
              "host": "rookepoole.github.io",
              "key": "e57ce0b65a8245aa8612e10aa870ab1d",
              "keyLocation": "https://rookepoole.github.io/worth-the-work/e57ce0b65a8245aa8612e10aa870ab1d.txt",
              "urlList": [
                "https://rookepoole.github.io/worth-the-work/",
                "https://rookepoole.github.io/worth-the-work/scope-creep-clause-generator/",
                "https://rookepoole.github.io/worth-the-work/freelance-revision-cost-calculator/",
                "https://rookepoole.github.io/worth-the-work/freelance-quote-response-generator/",
                "https://rookepoole.github.io/worth-the-work/freelance-rush-fee-calculator/"
              ]
            }'
